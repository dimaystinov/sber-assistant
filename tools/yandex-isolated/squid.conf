http_port 3128
visible_hostname yandex-egress
pid_filename none
cache deny all
access_log stdio:/dev/stdout squid
cache_log /dev/stderr

acl browser src 172.30.240.2/32
acl CONNECT method CONNECT
acl SSL_ports port 443 9443
acl Safe_ports port 80 443 9443
acl sber_port port 9443
acl sber_login dstdomain sbi.sberbank.ru
acl private_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4 ::1/128 fc00::/7 fe80::/10
acl telemetry dstdomain .yandex.ru .yandex.net .yandex.com .yandex.by .yandex.kz .yastatic.net .yandexcloud.net .ya.ru

http_access deny !browser
http_access deny sber_port !sber_login
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny private_dst
http_access deny telemetry
http_access allow browser
http_access deny all
