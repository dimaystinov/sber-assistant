server {
    listen 80;
    listen [::]:80;
    server_name sber.dimaystinov.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sber.dimaystinov.duckdns.org;
    root /var/www/sber-assistant-site;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/sber.dimaystinov.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sber.dimaystinov.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'none'" always;

    location / {
        try_files $uri $uri/ =404;
        limit_except GET HEAD { deny all; }
    }
    location ~ /\. { deny all; }
}
